name: Build KW Builder V4
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Download JUCE
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git JUCE
      - name: Record JUCE revision
        run: git -C JUCE rev-parse HEAD
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: KWBuilderV4-PreCut-PostTilt-${{ matrix.os }}
          path: build/KWBuilderV4_artefacts/Release/
